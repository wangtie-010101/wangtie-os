<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>贪吃蛇 - 王铁 OS 娱乐专区</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #0b2a1c, #04100a 70%);
      color: #e9fff4; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      user-select: none; touch-action: none;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #wrap {
      position: relative;
      width: min(100vw, 620px);
      height: min(100vh, 700px);
      background: #05130c;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.35), 0 0 46px rgba(16, 185, 129, 0.22);
    }
    #hud {
      position: absolute; z-index: 2; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 18px; font-weight: 700; color: #b7ffdd;
      text-shadow: 0 0 8px #10b981; letter-spacing: 1px; font-size: 15px;
    }
    #hud .sub { font-size: 12px; color: #8fd6b8; font-weight: 400; }
    #stage { position: absolute; inset: 46px 0 0 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      position: absolute; inset: 46px 0 0 0; z-index: 3;
      display: flex; align-items: center; justify-content: center; text-align: center;
      background: rgba(2, 14, 8, 0.78); backdrop-filter: blur(1px);
      padding: 24px;
    }
    .panel {
      width: min(100%, 400px); padding: 26px 22px;
      border: 1px solid rgba(74, 222, 128, 0.6); border-radius: 14px;
      background: rgba(4, 24, 14, 0.92);
      box-shadow: inset 0 0 26px rgba(16, 185, 129, 0.12), 0 0 30px rgba(16, 185, 129, 0.15);
    }
    h1 {
      margin: 0 0 6px; color: #6ee7a8; font-size: clamp(32px, 7vw, 48px);
      letter-spacing: 5px; text-shadow: 0 0 10px #10b981, 0 0 26px #059669;
    }
    h2 { margin: 0 0 12px; color: #ffd27a; font-size: 24px; text-shadow: 0 0 10px #f59e0b; }
    .tip { margin: 14px auto 18px; color: #c5ecd9; font-size: 13px; line-height: 2.05; }
    .key {
      display: inline-block; min-width: 26px; padding: 0 6px; margin: 0 2px;
      border: 1px solid #34d399; border-radius: 4px; background: rgba(16, 185, 129, 0.18);
      color: #fff; font-weight: 700; line-height: 21px; font-size: 13px;
    }
    .score-line { font-size: 19px; line-height: 2; }
    .hint { color: #86efac; font-size: 16px; animation: blink 1.3s infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <div>得分：<span id="score">0</span><br><span class="sub">长度：<span id="len">3</span></span></div>
      <div style="text-align:right">最高：<span id="high">0</span><br><span class="sub" id="speedTxt">速度 1</span></div>
    </div>
    <div id="stage"><canvas id="board"></canvas></div>
    <div id="overlay">
      <div class="panel" id="panel"></div>
    </div>
  </div>

  <script>
    "use strict";

    // =========================
    // 画布与基础尺寸
    // =========================
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('panel');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const lenEl = document.getElementById('len');
    const speedEl = document.getElementById('speedTxt');

    const COLS = 22;          // 棋盘列数
    const ROWS = 22;          // 棋盘行数
    let cell = 0;             // 单元格像素
    let dpr = 1;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cell = Math.max(8, Math.floor(Math.min(rect.width / COLS, rect.height / ROWS)));
    }
    window.addEventListener('resize', resize);

    // =========================
    // 游戏状态
    // =========================
    const S = { READY: 'ready', RUN: 'run', PAUSED: 'paused', OVER: 'over' };
    let state = S.READY;
    let snake, dir, queue, food, score, high, alive, stepMs, timer, startedAt;

    const KEY_HIGH = 'snakeHighScore';
    high = Number(localStorage.getItem(KEY_HIGH) || 0);
    highEl.textContent = high;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // =========================
    // 初始化 / 逻辑
    // =========================
    function reset() {
      const cx = Math.floor(COLS / 2);
      const cy = Math.floor(ROWS / 2);
      snake = [
        { x: cx, y: cy },
        { x: cx - 1, y: cy },
        { x: cx - 2, y: cy },
      ];
      dir = { x: 1, y: 0 };
      queue = [];
      score = 0;
      alive = true;
      updateHud();
      spawnFood();
    }

    function spawnFood() {
      while (true) {
        const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
        if (!snake.some((s) => s.x === f.x && s.y === f.y)) { food = f; return }
      }
    }

    function stepMsOf() {
      // 速度随长度提升：起始 150ms，最短 70ms
      return clamp(150 - (snake.length - 3) * 7, 70, 150);
    }

    function updateHud() {
      scoreEl.textContent = score;
      highEl.textContent = high;
      lenEl.textContent = snake ? snake.length : 3;
      const level = Math.floor((snake ? snake.length - 3 : 0) / 4) + 1;
      speedEl.textContent = '速度 ' + level;
    }

    function step() {
      if (state !== S.RUN) return;

      // 读取方向队列
      while (queue.length) {
        const next = queue.shift();
        if (!(next.x === -dir.x && next.y === -dir.y) && !(next.x === dir.x && next.y === dir.y)) {
          dir = next;
          break;
        }
      }

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 撞墙
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return die();
      }
      // 撞自己（尾巴即将移走时不算）
      const willEat = head.x === food.x && head.y === food.y;
      const bodyToCheck = willEat ? snake : snake.slice(0, -1);
      if (bodyToCheck.some((s) => s.x === head.x && s.y === head.y)) {
        return die();
      }

      snake.unshift(head);
      if (willEat) {
        score += 10;
        updateHud();
        if (score > high) { high = score; localStorage.setItem(KEY_HIGH, String(high)); highEl.textContent = high }
        spawnFood();
      } else {
        snake.pop();
      }
      updateHud();
      scheduleStep();
    }

    function die() {
      alive = false;
      state = S.OVER;
      if (timer) { clearTimeout(timer); timer = null }
      showOver();
    }

    function scheduleStep() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(step, stepMsOf());
    }

    // =========================
    // 控制
    // =========================
    function pushDir(x, y) {
      const last = queue.length ? queue[queue.length - 1] : dir;
      if (x === -last.x && y === -last.y) return;          // 禁止直接反向
      if (x === last.x && y === last.y) return;
      if (queue.length < 2) queue.push({ x, y });
    }

    window.addEventListener('keydown', function (e) {
      const k = e.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'w', 'a', 's', 'd', 'enter', 'p'].includes(k)) {
        e.preventDefault();
      }

      if (k === 'enter') {
        if (state === S.READY || state === S.OVER) startGame();
        return;
      }
      if (k === 'p' || k === ' ') {
        if (state === S.RUN) { pauseGame(); return }
        if (state === S.PAUSED) { resumeGame(); return }
        if (state === S.READY || state === S.OVER) startGame();
        return;
      }
      if (state !== S.RUN) return;
      if (k === 'arrowup' || k === 'w') pushDir(0, -1);
      else if (k === 'arrowdown' || k === 's') pushDir(0, 1);
      else if (k === 'arrowleft' || k === 'a') pushDir(-1, 0);
      else if (k === 'arrowright' || k === 'd') pushDir(1, 0);
    });

    // =========================
    // 流程
    // =========================
    function showStart() {
      state = S.READY;
      panel.innerHTML = `
        <h1>贪吃蛇</h1>
        <div class="tip">
          <span class="key">←↑↓→</span> 或 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>：转向<br>
          <span class="key">空格</span>：开始 / 暂停 &nbsp; <span class="key">P</span>：暂停 &nbsp; <span class="key">Enter</span>：开始 / 重新开始
        </div>
        <div class="hint">按 Enter 开始游戏</div>`;
      overlay.style.display = 'flex';
    }

    function startGame() {
      reset();
      state = S.RUN;
      overlay.style.display = 'none';
      scheduleStep();
    }

    function pauseGame() {
      state = S.PAUSED;
      if (timer) { clearTimeout(timer); timer = null }
      panel.innerHTML = `<h2>已暂停</h2><div class="hint">按 P 或 空格 继续</div>`;
      overlay.style.display = 'flex';
    }

    function resumeGame() {
      state = S.RUN;
      overlay.style.display = 'none';
      scheduleStep();
    }

    function showOver() {
      panel.innerHTML = `
        <h2>游戏结束</h2>
        <div class="score-line">最终得分：<strong style="color:#86efac">${score}</strong><br>
        历史最高：<strong style="color:#ffd27a">${high}</strong></div>
        <div class="tip" style="margin-top:8px">撞墙或撞到自己都会结束游戏哦</div>
        <div class="hint">按 Enter 重新开始</div>`;
      overlay.style.display = 'flex';
    }

    // =========================
    // 渲染
    // =========================
    function draw() {
      const w = canvas.clientWidth || 600;
      const h = canvas.clientHeight || 600;
      ctx.clearRect(0, 0, w, h);

      // 棋盘底色与网格
      const ox = (w - cell * COLS) / 2;
      const oy = (h - cell * ROWS) / 2;
      ctx.fillStyle = '#071b11';
      ctx.fillRect(ox, oy, cell * COLS, cell * ROWS);
      ctx.strokeStyle = 'rgba(80, 180, 130, 0.10)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(ox + x * cell, oy); ctx.lineTo(ox + x * cell, oy + cell * ROWS); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(ox, oy + y * cell); ctx.lineTo(ox + cell * COLS, oy + y * cell); ctx.stroke();
      }

      if (!snake) return;

      // 食物
      if (food) {
        ctx.save();
        ctx.shadowBlur = 14; ctx.shadowColor = '#ff5a5a';
        const fx = ox + food.x * cell + cell / 2;
        const fy = oy + food.y * cell + cell / 2;
        ctx.fillStyle = '#ff5a6e';
        ctx.beginPath(); ctx.arc(fx, fy, cell * 0.34, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath(); ctx.arc(fx - cell * 0.1, fy - cell * 0.12, cell * 0.08, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // 蛇身
      for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const sx = ox + seg.x * cell;
        const sy = oy + seg.y * cell;
        const inset = cell * 0.1;
        const head = i === 0;
        ctx.save();
        if (!head) ctx.shadowBlur = 6; else ctx.shadowBlur = 12;
        ctx.shadowColor = head ? '#a7f3d0' : '#34d399';
        ctx.fillStyle = head ? '#7cf5b4' : (i % 2 ? '#1f9d63' : '#2ecc7e');
        const r = Math.min(5, cell * 0.22);
        const px = sx + inset, py = sy + inset, pw = cell - inset * 2, ph = cell - inset * 2;
        ctx.beginPath();
        ctx.moveTo(px + r, py);
        ctx.arcTo(px + pw, py, px + pw, py + ph, r);
        ctx.arcTo(px + pw, py + ph, px, py + ph, r);
        ctx.arcTo(px, py + ph, px, py, r);
        ctx.arcTo(px, py, px + pw, py, r);
        ctx.closePath();
        ctx.fill();
        // 眼睛
        if (head) {
          ctx.fillStyle = '#06281a';
          const cxp = sx + cell / 2, cyp = sy + cell / 2;
          const perp = { x: -dir.y, y: dir.x };
          for (const s of [-1, 1]) {
            const ex = cxp + dir.x * cell * 0.18 + perp.x * s * cell * 0.14;
            const ey = cyp + dir.y * cell * 0.18 + perp.y * s * cell * 0.14;
            ctx.beginPath(); ctx.arc(ex, ey, cell * 0.09, 0, Math.PI * 2); ctx.fill();
          }
        }
        ctx.restore();
      }
    }

    // =========================
    // 主循环（渲染）与启动
    // =========================
    function loop() {
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    showStart();
    loop();
  </script>
</body>
</html>
